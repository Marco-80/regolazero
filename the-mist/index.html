<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>RegolaZero — The Mist</title>
  <style>
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #121212;
      color: #cfcfcf;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 2rem 1.25rem;
      box-sizing: border-box;
    }
    img { width: min(70vw, 20rem); height: auto; }
    h1 { font-size: 1.2rem; font-weight: 600; margin: 2rem 0 0.5rem; }
    p { color: #9c9c9c; margin: 0 0 2rem; }
    a { color: #cfcfcf; }
  </style>
</head>
<body>
  <div>
    <img src="/images/site/logo-regolazero.png" alt="RegolaZero" />
    <h1>The Mist</h1>
    <p>Pagina in arrivo.</p>
    <p><a href="/CMS/">Visita il blog RegolaZero</a></p>
    <a href="/">&larr; Torna alla home</a>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script>
    // Solo per la modalità manutenzione (interruttore nel blog, admin):
    // se config/sito ha manutenzione:true, copre la pagina con un avviso.
    firebase.initializeApp({
      apiKey: "AIzaSyAI0cMoWqHRkhEZTkZiyFDz1axJ99DWZ4I",
      authDomain: "regolazero.firebaseapp.com",
      projectId: "regolazero",
      storageBucket: "regolazero.firebasestorage.app",
      messagingSenderId: "393442629307",
      appId: "1:393442629307:web:18e3e493c5f5d450e3bb9e",
    });
    firebase.firestore().collection('config').doc('sito').get().then(function (doc) {
      if (!(doc.exists && doc.data().manutenzione === true)) return;
      var ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#121212;color:#cfcfcf;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;';
      ov.innerHTML = '<div><p style="font-size:1.15rem;font-weight:600;margin:0 0 .5rem;">Sito in manutenzione</p><p style="color:#9c9c9c;margin:0;">Torniamo online a breve.</p></div>';
      document.body.appendChild(ov);
    }).catch(function () {});
  </script>
</body>
</html>
