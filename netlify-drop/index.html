<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>RegolaZero — conferma account</title>
  <style>
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #121212;
      color: #cfcfcf;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 2rem 1.25rem;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div>
    <p>Un attimo, stiamo confermando l'account…</p>
    <p><a href="https://regolazero.it/coming-soon/">Se non vieni reindirizzato, clicca qui.</a></p>
  </div>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    // Questa pagina esiste SOLO per "consumare" il link di conferma/invito
    // che Netlify Identity manda via email (di default punta qui, alla
    // radice del progetto Netlify, e non c'è modo di cambiarlo senza il
    // piano Pro). Il widget legge il token dall'URL, conferma l'account,
    // poi si torna sul sito vero dove si fa il login per davvero.
    // Vedi CLAUDE.md §15.
    window.netlifyIdentity && window.netlifyIdentity.init({
      APIUrl: 'https://regolazero.netlify.app/.netlify/identity'
    });

    function vaiAlSito() {
      window.location.href = 'https://regolazero.it/coming-soon/';
    }

    if (window.netlifyIdentity) {
      netlifyIdentity.on('init', function () { setTimeout(vaiAlSito, 1500); });
      netlifyIdentity.on('error', function () { setTimeout(vaiAlSito, 2500); });
    } else {
      setTimeout(vaiAlSito, 2500);
    }
  </script>
</body>
</html>
