<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>RegolaZero — In arrivo</title>
  <style>
    body {
      margin: 0;
      min-height: 100svh;
      overflow: hidden;
      background: #121212;
      color: #cfcfcf;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #nebbia {
      position: fixed;
      inset: 0;
      z-index: 0;
      filter: blur(70px);
    }
    .contenuto {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem 1.25rem;
      box-sizing: border-box;
    }
    .logo {
      width: min(90vw, 32rem);
      height: auto;
      animation: respiro 10s ease-in-out infinite;
    }
    @keyframes respiro {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(0.4); }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo { animation: none; }
    }
    p { margin-top: 2rem; font-size: 1.1rem; color: #9c9c9c; }
  </style>
</head>
<body>
  <div id="nebbia"></div>
  <div id="audio-sottofondo" style="position: fixed; width: 1px; height: 1px; overflow: hidden; opacity: 0;"></div>

  <div class="contenuto">
    <div>
      <img class="logo" src="/images/site/logo-regolazero.png" alt="RegolaZero" width="1600" height="656" />
      <p>Il sito è in costruzione. Torna presto.</p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script>
    // Nebbia di sfondo: due gruppi di macchie che derivano lentissime con
    // rumore di Perlin (percorsi indipendenti, quindi si incrociano, si
    // fondono e si dividono da sole), sfocate via CSS, quasi impercettibili.
    new p5(function (p) {
      var macchie = [];
      var N_NUCLEI = 3;   // macchie compatte, come quelle originali
      var N_DIFFUSE = 3;  // macchie più larghe e diradate

      p.setup = function () {
        var c = p.createCanvas(p.windowWidth, p.windowHeight);
        c.parent('nebbia');
        p.noStroke();
        for (var i = 0; i < N_NUCLEI; i++) {
          macchie.push({
            seed: i * 137,
            r: p.random(0.35, 0.6) * Math.max(p.width, p.height),
            alpha: 5,
            vel: 1,
          });
        }
        for (var j = 0; j < N_DIFFUSE; j++) {
          macchie.push({
            seed: (j + N_NUCLEI) * 137 + 5000,
            r: p.random(0.85, 1.15) * Math.max(p.width, p.height),
            alpha: 3,
            vel: 0.6, // ancora più lente, restano diffuse sullo sfondo
          });
        }
      };

      p.windowResized = function () {
        p.resizeCanvas(p.windowWidth, p.windowHeight);
      };

      p.draw = function () {
        p.clear();
        for (var i = 0; i < macchie.length; i++) {
          var m = macchie[i];
          var t = p.frameCount * 0.0015 * m.vel; // lentissimo
          var nx = p.noise(m.seed, t) * p.width;
          var ny = p.noise(m.seed + 50, t) * p.height;
          p.fill(255, 255, 255, m.alpha); // appena percettibile
          p.ellipse(nx, ny, m.r, m.r);
        }
      };
    });
  </script>

  <script>
    // Audio di sottofondo: player YouTube nascosto (youtube-nocookie.com),
    // in loop, a volume molto basso. Parte muto (i browser bloccano
    // l'autoplay con audio) e si sblocca al primo tocco/click/tasto.
    (function () {
      var VIDEO_ID = '1YhKgK_2PU4';
      var VOLUME = 8; // 0-100, molto basso
      var player = null;
      var sbloccato = false;

      var tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);

      window.onYouTubeIframeAPIReady = function () {
        player = new YT.Player('audio-sottofondo', {
          host: 'https://www.youtube-nocookie.com',
          videoId: VIDEO_ID,
          playerVars: {
            autoplay: 1,
            mute: 1,
            loop: 1,
            playlist: VIDEO_ID,
            controls: 0,
            disablekb: 1,
            fs: 0,
            modestbranding: 1,
            playsinline: 1
          },
          events: {
            onReady: function (e) {
              e.target.setVolume(VOLUME);
              e.target.playVideo();
            }
          }
        });
      };

      function sbloccaAudio() {
        if (sbloccato || !player || typeof player.unMute !== 'function') return;
        sbloccato = true;
        player.unMute();
        player.setVolume(VOLUME);
        player.playVideo();
        ['click', 'touchstart', 'keydown'].forEach(function (ev) {
          document.removeEventListener(ev, sbloccaAudio);
        });
      }

      ['click', 'touchstart', 'keydown'].forEach(function (ev) {
        document.addEventListener(ev, sbloccaAudio);
      });
    })();
  </script>
</body>
</html>
