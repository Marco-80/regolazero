<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>RegolaZero — In arrivo</title>
  <style>
    body {
      margin: 0;
      min-height: 100svh;
      overflow: hidden;
      background: #121212;
      color: #cfcfcf;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #nebbia {
      position: fixed;
      inset: 0;
      z-index: 0;
      filter: blur(70px);
    }
    #audio-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 2;
      width: 2.75rem;
      height: 2.75rem;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid rgba(207, 207, 207, 0.35);
      background: rgba(255, 255, 255, 0.05);
      color: #cfcfcf;
      cursor: pointer;
    }
    #audio-toggle:hover,
    #audio-toggle:focus-visible {
      background: rgba(255, 255, 255, 0.12);
    }
    /* [hidden] su <svg> non è affidabile su tutti i browser: regola
       esplicita invece di fidarsi dello stylesheet di default. */
    #audio-toggle svg[hidden] {
      display: none;
    }
    .contenuto {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem 1.25rem;
      box-sizing: border-box;
      /* trasparente ma copre tutta la pagina: senza questo, essendo dopo
         #pannelli nel DOM con lo stesso z-index, ne intercetterebbe i
         click ovunque tranne esattamente sul logo. */
      pointer-events: none;
    }
    .logo {
      width: min(90vw, 32rem);
      height: auto;
      animation: respiro 10s ease-in-out infinite;
      cursor: pointer;
    }
    @keyframes respiro {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(0.4); }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo { animation: none; }
    }
    .salita {
      position: relative;
      pointer-events: auto;
      transition: transform 5.6s cubic-bezier(0.83, 0, 0.17, 1);
    }
    /* Indicatore "Cliccami": freccia verso il logo, in dissolvenza dopo
       qualche secondo. Sparisce subito (non in dissolvenza) al click. */
    #cliccami {
      position: absolute;
      left: 48%;
      top: -30%;
      width: 40%;
      height: auto;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }
    #cliccami.cliccami--visibile {
      opacity: 1;
      transition: opacity 1.2s ease;
    }
    /* Pannelli: indipendenti dal logo. Partono più in basso del centro
       schermo e in dissolvenza risalgono fino al centro, più veloci
       della risalita del logo (3.4s contro 5.6s). */
    .pannelli {
      position: fixed;
      z-index: 1;
      left: 0;
      right: 0;
      top: 50%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: clamp(1rem, 3vw, 2rem);
      padding: 0 1.25rem;
      box-sizing: border-box;
      opacity: 0;
      transform: translateY(calc(-50% + 22vh));
      transition: transform 3.4s cubic-bezier(0.83, 0, 0.17, 1), opacity 3.4s ease;
    }
    .pannelli--visibile {
      opacity: 1;
      /* transform finale impostato via JS (calcolato per non finire mai
         sotto il logo, a qualunque risoluzione) */
    }
    .link-blog {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 1.5rem;
      z-index: 2;
      text-align: center;
      color: #9c9c9c;
      font-size: 0.85rem;
      text-decoration: none;
      opacity: 0;
      transition: opacity 3.4s ease;
    }
    .link-blog:hover { color: #cfcfcf; }
    .link-blog--visibile { opacity: 1; }
    .pannello {
      border: 1px solid rgba(207, 207, 207, 0.35);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.015));
      box-sizing: border-box;
    }
    .pannello--link {
      display: block;
      text-decoration: none;
      background-size: cover;
      background-position: center;
      transition: filter 0.2s ease, border-color 0.2s ease;
    }
    .pannello--link:hover,
    .pannello--link:focus-visible {
      filter: brightness(1.12);
      border-color: rgba(207, 207, 207, 0.55);
    }
    #pannello-sinistra { background-image: url('/images/site/m_mappa.png'); }
    #pannello-destra { background-image: url('/images/site/m_scopri.png'); }
    .pannello--newsletter {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 1.25rem;
      background-image: url('/images/site/m_news.png');
      background-size: cover;
      background-position: center;
    }
    .form-newsletter {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.9rem;
    }
    .form-newsletter input[type="email"] {
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      border: 1px solid rgba(207, 207, 207, 0.35);
      background: #e9e7e2;
      color: #1a1a1a;
      font-size: 0.9rem;
      box-sizing: border-box;
    }
    .form-newsletter button {
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      border: none;
      background: #e9e7e2;
      color: #1a1a1a;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
    }
    .form-newsletter button:hover {
      background: #fff;
    }
    .form-newsletter button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }
    .form-newsletter button:disabled:hover {
      background: #e9e7e2;
    }
    .form-newsletter .newsletter-msg {
      margin: 0;
      font-size: 0.8rem;
      text-align: center;
      color: #9c9c9c;
    }
    .pannello--laterale {
      width: clamp(140px, 26vw, 380px);
      aspect-ratio: 380 / 249;
    }
    .pannello--centrale {
      width: clamp(150px, 26vw, 380px);
      aspect-ratio: 380 / 500;
      margin-top: clamp(1.5rem, 6vw, 5rem);
    }
    /* Schermi stretti: non 3 affiancati né impilati in colonna, ma
       2 quadrati in alto (sinistra/destra) + 1 rettangolo largo sotto
       (centro), tutti dentro lo schermo. */
    @media (max-width: 640px) {
      .pannelli {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-areas: "sinistra destra" "centro centro";
        gap: 0.75rem;
        width: min(92vw, 460px);
        margin-left: auto;
        margin-right: auto;
      }
      .pannello--laterale,
      .pannello--centrale {
        width: auto;
        margin-top: 0;
      }
      .pannello--laterale { aspect-ratio: 1 / 1; }
      .pannello--centrale { aspect-ratio: 14 / 15; }
      #pannello-sinistra { grid-area: sinistra; }
      #pannello-destra { grid-area: destra; }
      #pannello-centro { grid-area: centro; }
    }
  </style>
</head>
<body>
  <div id="nebbia"></div>
  <div id="audio-sottofondo" style="position: fixed; width: 1px; height: 1px; overflow: hidden; opacity: 0;"></div>

  <button type="button" id="audio-toggle" aria-label="Attiva audio" aria-pressed="false">
    <svg id="icona-audio-off" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
      <path d="M3 10v4h4l5 5V5L7 10H3z"/>
      <path d="M19.5 12l2.47-2.47-1.06-1.06L18.44 10.94 15.97 8.47 14.91 9.53l2.47 2.47-2.47 2.47 1.06 1.06 2.47-2.47 2.47 2.47 1.06-1.06L19.5 12z"/>
    </svg>
    <svg id="icona-audio-on" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true" hidden>
      <path d="M3 10v4h4l5 5V5L7 10H3z"/>
      <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.06c1.48-.74 2.5-2.26 2.5-4.03z"/>
      <path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
    </svg>
  </button>

  <div class="pannelli" id="pannelli">
    <a class="pannello pannello--laterale pannello--link" id="pannello-sinistra" href="/mappa/" aria-label="Mappa interattiva e generatori"></a>
    <div class="pannello pannello--centrale pannello--newsletter" id="pannello-centro">
      <form class="form-newsletter" id="form-newsletter">
        <input type="email" name="email" id="campo-email-newsletter" placeholder="Inserisci la tua mail" required />
        <button type="submit" id="btn-iscriviti">Iscriviti</button>
        <p class="newsletter-msg" id="newsletter-msg" hidden></p>
      </form>
    </div>
    <a class="pannello pannello--laterale pannello--link" id="pannello-destra" href="/the-mist/" aria-label="Scopri The Mist"></a>
  </div>

  <a class="link-blog" id="link-blog" href="/CMS/">Visita il blog RegolaZero</a>

  <div class="contenuto">
    <div class="salita" id="salita">
      <img class="logo" id="logo" src="/images/site/logo-regolazero.png" alt="RegolaZero" width="1600" height="656" />
      <img id="cliccami" src="/images/site/cliccami.png" alt="" width="224" height="88" />
    </div>
  </div>

  <script>
    // Al click sul logo: risalita fluida (5,6s, accelera e decelera
    // lentamente) fino a fermarsi a 50px dal bordo superiore. Quando il
    // logo è a metà della sua risalita, partono (indipendenti dal logo)
    // i 3 pannelli: più in basso, risalgono in dissolvenza fino quasi al
    // centro schermo, più veloci del logo (3.4s). Una volta sola: click
    // successivi non fanno nulla.
    (function () {
      var logo = document.getElementById('logo');
      var salita = document.getElementById('salita');
      var pannelli = document.getElementById('pannelli');
      var spostato = false;
      var DURATA_LOGO_MS = 5600;

      logo.addEventListener('click', function () {
        if (spostato) return;
        spostato = true;
        var rect = logo.getBoundingClientRect();
        var margine = 50;
        var delta = margine - rect.top; // negativo: risale
        salita.style.transform = 'translateY(' + delta + 'px)';

        // Posizione finale dei pannelli: centro schermo + 30px, MA mai
        // sopra al logo (che finirà a "margine" + la sua altezza) — a
        // nessuna risoluzione, calcolato sulle dimensioni reali di
        // viewport/logo/pannelli. Il delta è relativo all'ancora CSS
        // "top: 50%" (non alla posizione attuale, già spostata dal
        // transform iniziale: settare transform via JS lo sostituisce,
        // non lo somma).
        var logoBottomFinale = margine + rect.height;
        var altezzaPannelli = pannelli.getBoundingClientRect().height;
        var margineSicurezza = 24;
        var centroDesiderato = window.innerHeight / 2 + 30;
        var topDesiderato = centroDesiderato - altezzaPannelli / 2;
        var topMinimo = logoBottomFinale + margineSicurezza;
        var topFinale = Math.max(topDesiderato, topMinimo);
        var deltaPannelli = topFinale - window.innerHeight / 2;

        // Mobile (layout a griglia: 2 quadrati sopra + 1 rettangolo largo
        // sotto): se non c'è spazio verticale a sufficienza, il blocco
        // sotto si accorcia (perde il suo aspect-ratio ideale) invece di
        // uscire dallo schermo.
        if (window.matchMedia('(max-width: 640px)').matches) {
          var centro = document.getElementById('pannello-centro');
          var altezzaRigaAlta = document.getElementById('pannello-sinistra').getBoundingClientRect().height;
          var gapMobile = 12; // 0.75rem
          var margineInferiore = 16;
          var spazioDisponibile = window.innerHeight - (topFinale + altezzaRigaAlta + gapMobile) - margineInferiore;
          if (spazioDisponibile > 40 && centro.getBoundingClientRect().height > spazioDisponibile) {
            // aspect-ratio, altrimenti attivo, ricalcolerebbe la
            // larghezza in base alla nuova altezza: va disattivato per
            // mantenere piena la larghezza (larga come i due blocchi
            // sopra insieme) e accorciare solo l'altezza.
            centro.style.aspectRatio = 'auto';
            centro.style.height = spazioDisponibile + 'px';
          }
        }

        setTimeout(function () {
          pannelli.classList.add('pannelli--visibile');
          pannelli.style.transform = 'translateY(' + deltaPannelli + 'px)';
          document.getElementById('link-blog').classList.add('link-blog--visibile');
        }, DURATA_LOGO_MS / 2);
      });
    })();
  </script>

  <script>

  <script>
    // Form newsletter: salva l'email su Firestore (collezione
    // "newsletter"). Le regole del database impediscono di leggere la
    // lista delle email dal client (solo creazione, mai lettura) — v.
    // CLAUDE.md.
    (function () {
      var form = document.getElementById('form-newsletter');
      var campoEmail = document.getElementById('campo-email-newsletter');
      var pulsante = document.getElementById('btn-iscriviti');
      var messaggio = document.getElementById('newsletter-msg');
      var collezioneNewsletter = firebase.firestore().collection('newsletter');

      function mostraMessaggio(testo) {
        messaggio.textContent = testo;
        messaggio.hidden = false;
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var email = campoEmail.value.trim();
        if (!email) return;
        pulsante.disabled = true;
        collezioneNewsletter.add({
          email: email,
          creato: firebase.firestore.FieldValue.serverTimestamp(),
        }).then(function () {
          mostraMessaggio('Iscrizione ricevuta, grazie!');
          form.reset();
          pulsante.disabled = false;
        }).catch(function (errore) {
          console.error('Errore iscrizione newsletter:', errore);
          mostraMessaggio('Non sono riuscito a registrare la mail. Riprova.');
          pulsante.disabled = false;
        });
      });
    })();
  </script>

  <script>
    // Indicatore "Cliccami": compare in dissolvenza 4,5s dopo il
    // caricamento della pagina. Sparisce subito (non in dissolvenza,
    // "di botto": si toglie anche la transizione, non solo la classe)
    // al click sul logo — e se si clicca prima che compaia, il timer
    // viene annullato e non compare affatto.
    (function () {
      var logo = document.getElementById('logo');
      var cliccami = document.getElementById('cliccami');
      var RITARDO_MS = 4500;

      var timer = setTimeout(function () {
        cliccami.classList.add('cliccami--visibile');
      }, RITARDO_MS);

      logo.addEventListener('click', function () {
        clearTimeout(timer);
        cliccami.classList.remove('cliccami--visibile'); // niente transizione: sparisce di botto
      });
    })();
  </script>

  <script>
    // Il "respiro" del logo (variazione di luminosità) è un @keyframes
    // CSS a durata fissa, quindi perfettamente regolare/meccanico. Per
    // renderlo più organico, a ogni ciclo si varia leggermente la durata
    // (10s ± 1,5s) invece di lasciarla identica ogni volta — ma SEMPRE
    // in modo fluido: limitarsi a cambiare "animation-duration" a caldo
    // scatta, perché il browser ricalcola il punto dell'animazione sul
    // tempo trascorso totale (non da quando è iniziato il ciclo). Si
    // riparte quindi da zero un'animazione nuova a ogni ciclo — invisibile,
    // perché inizio (0%) e fine (100%) del keyframe hanno lo stesso valore.
    (function () {
      var logo = document.getElementById('logo');
      var DURATA_BASE = 10; // secondi, deve combaciare col CSS
      var VARIAZIONE = 1.5; // secondi, in più o in meno

      logo.addEventListener('animationiteration', function (e) {
        if (e.animationName !== 'respiro') return;
        var durata = DURATA_BASE + (Math.random() * 2 - 1) * VARIAZIONE;
        logo.style.animation = 'none';
        void logo.offsetWidth; // forza il reflow: il browser "dimentica" lo stato precedente
        logo.style.animation = 'respiro ' + durata.toFixed(2) + 's ease-in-out infinite';
      });
    })();
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script>
    // Nebbia di sfondo: NON macchie/forme separate (avrebbero sempre un
    // bordo riconoscibile, anche sfumato) ma un campo di rumore di Perlin
    // continuo su tutta la griglia dello schermo, che evolve nel tempo:
    // le zone più chiare nascono, si fondono e si dividono da sole come
    // proprietà naturale del campo, senza forme discrete. Sfocato via CSS
    // (blur) per eliminare ogni residuo di "quadrettatura" della griglia.
    new p5(function (p) {
      var CELLA = 24; // griglia più fitta (era 48): più dettaglio
      var SCALA = 0.022; // macchie meno estese (era 0.012): il rumore varia più in fretta nello spazio
      var SCALA_DETTAGLIO = SCALA * 3.2; // secondo strato più fine, sovrapposto: dà l'aspetto più caotico
      var VELOCITA_BASE = 0.00035; // evoluzione nel tempo, invariata (richiesto "mantenendo la velocità")
      var colonne, righe;
      var t = 0;

      p.setup = function () {
        var c = p.createCanvas(p.windowWidth, p.windowHeight);
        c.parent('nebbia');
        p.noStroke();
        ricalcolaGriglia();
      };

      function ricalcolaGriglia() {
        colonne = Math.ceil(p.width / CELLA) + 1;
        righe = Math.ceil(p.height / CELLA) + 1;
      }

      p.windowResized = function () {
        p.resizeCanvas(p.windowWidth, p.windowHeight);
        ricalcolaGriglia();
      };

      p.draw = function () {
        p.clear();

        // La velocità di evoluzione del campo varia da sola nel tempo
        // (0.4x-1.6x), ma resta lenta in media.
        var variazioneVel = p.noise(9999, p.frameCount * 0.0006);
        var fattoreVel = 0.4 + variazioneVel * 1.2;
        t += VELOCITA_BASE * fattoreVel;

        for (var gy = 0; gy < righe; gy++) {
          for (var gx = 0; gx < colonne; gx++) {
            // Due strati di rumore sovrapposti: uno ampio (l'ondulazione
            // di base) e uno più fine a peso minore (il "caos" richiesto:
            // rompe la regolarità del primo, senza far perdere la forma
            // morbida generale).
            var base = p.noise(gx * SCALA, gy * SCALA, t);
            var dettaglio = p.noise(gx * SCALA_DETTAGLIO + 500, gy * SCALA_DETTAGLIO + 500, t * 1.4);
            var n = base * 0.65 + dettaglio * 0.35;
            // Range di ingresso più stretto (0.25-0.7 invece di 0.2-0.8) e
            // uscita più ampia (0-13 invece di 0-9): più contrasto, punti
            // più chiari, luminosità che varia di più.
            var alpha = p.map(n, 0.25, 0.7, 0, 13, true);
            if (alpha < 0.4) continue; // cella praticamente invisibile: salta, per performance
            p.fill(255, 255, 255, alpha);
            p.rect(gx * CELLA, gy * CELLA, CELLA + 1, CELLA + 1); // +1: niente microfessure tra celle
          }
        }
      };
    });
  </script>

  <script>
    // Audio di sottofondo: player YouTube nascosto (youtube-nocookie.com),
    // in loop, a volume molto basso. Parte con l'audio già attivo (non
    // muto): i browser però bloccano quasi sempre l'autoplay con audio
    // senza un'interazione dell'utente, quindi come rete di sicurezza lo
    // sblocca comunque al primo tocco/click/tasto se serve. Il pulsante
    // in alto a destra resta il controllo manuale attiva/disattiva.
    (function () {
      var VIDEO_ID = '1YhKgK_2PU4';
      // var VIDEO_ID_PRECEDENTE = 'c6RiHp2-bGY'; // audio di prima, tenuto qui se si torna indietro
      var VOLUME = 8; // 0-100, molto basso
      var player = null;
      var attivo = true; // stato desiderato: parte attivo

      var btn = document.getElementById('audio-toggle');
      var iconaOn = document.getElementById('icona-audio-on');
      var iconaOff = document.getElementById('icona-audio-off');

      function aggiornaIcona() {
        // niente .hidden (non affidabile su <svg> in tutti i browser):
        // attributo esplicito.
        if (attivo) {
          iconaOn.removeAttribute('hidden');
          iconaOff.setAttribute('hidden', '');
        } else {
          iconaOff.removeAttribute('hidden');
          iconaOn.setAttribute('hidden', '');
        }
        btn.setAttribute('aria-pressed', attivo ? 'true' : 'false');
        btn.setAttribute('aria-label', attivo ? 'Disattiva audio' : 'Attiva audio');
      }
      aggiornaIcona(); // icona corretta da subito, senza aspettare l'API YouTube

      var tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);

      window.onYouTubeIframeAPIReady = function () {
        player = new YT.Player('audio-sottofondo', {
          host: 'https://www.youtube-nocookie.com',
          videoId: VIDEO_ID,
          playerVars: {
            autoplay: 1,
            mute: 0, // tenta l'autoplay con audio
            loop: 1,
            playlist: VIDEO_ID,
            controls: 0,
            disablekb: 1,
            fs: 0,
            modestbranding: 1,
            playsinline: 1
          },
          events: {
            onReady: function (e) {
              e.target.setVolume(VOLUME);
              e.target.playVideo();
            }
          }
        });
      };

      btn.addEventListener('click', function () {
        if (!player || typeof player.unMute !== 'function') return;
        attivo = !attivo;
        if (attivo) {
          player.unMute();
          player.setVolume(VOLUME);
          player.playVideo();
        } else {
          player.mute();
        }
        aggiornaIcona();
      });

      // Rete di sicurezza: se il browser ha bloccato l'autoplay con audio
      // (resta muto nonostante mute:0), lo sblocca al primo tocco/click/
      // tasto sulla pagina — solo se l'utente non ha nel frattempo
      // disattivato l'audio col pulsante.
      function sbloccaSeServe() {
        if (!player || typeof player.isMuted !== 'function') return;
        if (attivo && player.isMuted()) {
          player.unMute();
          player.setVolume(VOLUME);
          player.playVideo();
        }
      }
      ['click', 'touchstart', 'keydown'].forEach(function (ev) {
        document.addEventListener(ev, sbloccaSeServe);
      });
    })();
  </script>
</body>
</html>
